name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The package advertises Node 18+, so the floor is verified alongside
        # the current LTS lines.
        node: ["18.x", "20.x", "22.x"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # vitest 4 (via rolldown) needs node:util.styleText, a Node 20.12+ API,
      # so the suite cannot start on 18 — but the proxy itself must, which is
      # what the advertised "Node 18+" claim is about. Prove that instead.
      - name: Tests
        if: matrix.node != '18.x'
        run: npm test

      - name: Runtime smoke test (Node 18)
        if: matrix.node == '18.x'
        run: |
          node dist/proxy.js &
          for _ in $(seq 1 20); do
            curl -sf http://127.0.0.1:17128/v2/status && break
            sleep 0.5
          done
          kill %1
